<style>
/* Layout: app de uma coluna, mobile-first, barra inferior com "Captar agora" no centro; telas de detalhe empilham por cima */

  --ok:#3CC79D; --ok-soft:#10302A; --warn:#E8AA3E; --warn-soft:#33260E; --bad:#F26B6B; --bad-soft:#3A1717;
  --t-comp:#8C9EFF; --t-grav:#F2508F; --t-edit:#B392F0; --t-rev:#E8AA3E; --t-pub:#3CC79D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1015; --surface:#181A21; --sunk:#22252E; --ink:#ECEEF3; --muted:#9BA1AE; --line:#2B2E38;
  --accent:#F2508F; --accent-soft:#3B1527; --on-accent:#1A0710;
  --ok:#3CC79D; --ok-soft:#10302A; --warn:#E8AA3E; --warn-soft:#33260E; --bad:#F26B6B; --bad-soft:#3A1717;
  --t-comp:#8C9EFF; --t-grav:#F2508F; --t-edit:#B392F0; --t-rev:#E8AA3E; --t-pub:#3CC79D; color-scheme:dark}
*{box-sizing:border-box}

input[type=text],input[type=search],input[type=url],input[type=date],input[type=time],input[type=number],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;min-height:44px}

function canAdvance(c){if(c.status==='Planejamento'){if(isRecorded(c))return{ok:true};const p=progress(c);if(!p.total)return{ok:false,why:'Defina os takes deste conteúdo primeiro.'};if(p.missing.length)return{ok:false,why:`Falta${p.missing.length>1?'m':''} ${p.missing.length} take${p.missing.length>1?'s':''} para concluir a captação.`};return{ok:true}}if(c.status==='Publicado')return{ok:false,why:''};return{ok:true}}
function contentConflicts(c){
  const out=[];const evs=S.events.filter(e=>arr(e.contentIds).includes(c.id));
  const pubs=S.pubs.filter(p=>p.contentId===c.id).map(p=>p.date).sort();const first=pubs[0]||c.pubDate;
  if(first)evs.forEach(e=>{if(['gravacao','edicao','revisao','finalizacao'].includes(e.type)&&e.date>first)out.push(`${EVT[e.type]} (${fmtShort(e.date)}) depois da publicação (${fmtShort(first)})`)});
  const rec=evs.filter(e=>e.type==='gravacao').map(e=>e.date).sort().pop();const ed=evs.filter(e=>e.type==='edicao').map(e=>e.date).sort()[0];
  if(rec&&ed&&ed<rec)out.push(`Edição (${fmtShort(ed)}) antes da gravação (${fmtShort(rec)})`);
  return out;
}
function captarResults(ctxs){
  const takes=S.takes.filter(t=>t.status!=='gravado'&&arr(t.contexts).some(c=>ctxs.includes(c)));
  const scored=takes.map(t=>{
    const cs=arr(t.contentIds).map(id=>byId('contents',id)).filter(c=>c&&c.status!=='Publicado');
    const dl=cs.map(c=>c.pubDate).filter(Boolean).sort()[0];
    let sc=cs.length*3;
    if(dl){const d=diffDays(TODAY,dl);sc+=d<0?6:d<=7?5:d<=14?3:d<=30?1:0}
    sc+={alta:3,media:1,baixa:0}[t.priority]||0;
    if(t.fixedEventId)sc+=2; if(t.hardToRepeat)sc+=2; const td=takeDay(t); if(td===TODAY)sc+=5; else if(td&&td<TODAY)sc+=4;
    return{t,cs,dl,sc};
  }).sort((a,b)=>b.sc-a.sc);
  const groups={};
  scored.forEach(r=>{const g=UI.grp==='atividade'?(r.t.action||'Outras ações'):UI.grp==='local'?(r.t.location||'Local livre'):(r.t.setting||ctxL(r.t.contexts?.[0]));(groups[g]=groups[g]||[]).push(r)});
  const lvl={principal:3,recomendado:2,alternativo:1};
  const prods=S.products.filter(p=>p.available!==false).map(p=>{const m=arr(p.contexts).filter(x=>ctxs.includes(x.ctx));const best=m.sort((a,b)=>lvl[b.level]-lvl[a.level])[0];return best?{p,level:best.level}:null}).filter(Boolean).sort((a,b)=>lvl[b.level]-lvl[a.level]);
  const contents=new Set();scored.forEach(r=>r.cs.forEach(c=>contents.add(c.id)));
  return{scored,groups,prods,contents:contents.size};
}
function calItems(){
  const items=[];
  S.events.forEach(e=>{const end=e.endDate&&e.endDate>e.date?e.endDate:e.date;let d=e.date,g=0;while(d<=end&&g<60){items.push({kind:'event',type:e.type,date:d,time:e.time||'',e,multi:end!==e.date});d=addDays(d,1);g++}});
  S.pubs.forEach(p=>items.push({kind:'pub',type:'publicacao',date:p.date,time:p.time||'',p}));

function itemContents(it){return it.kind==='pub'?[byId('contents',it.p.contentId)].filter(Boolean):arr(it.e.contentIds).map(id=>byId('contents',id)).filter(Boolean)}

function eventTakes(e){
  const cs=arr(e.contentIds).map(id=>byId('contents',id)).filter(Boolean);

  S.takes.forEach(t=>{if(t.fixedEventId&&(t.fixedEventId===e.id||t.fixedEventId===e.sourceId))set.set(t.id,t)});
  return[...set.values()];
}

const SYN={marca:['marcas','ugc','contratar','portfolio','atrair'],ugc:['ugc','marcas ugc','portfolio'],tiktok:['tiktok shop','vendas','comercial','produto'],venda:['vendas','tiktok shop','comercial','objecao'],autoridade:['autoridade','bastidores','processo','resultado'],branding:['branding','marca pessoal','posicionamento','estetica'],gestao:['gestao','campanha','resultado','tiktok shop'],casal:['casal','namorado','relacionamento'],viagem:['viagem','vlog','praia','turismo']};
function refScore(r,q){
  const words=norm(q).split(/[^a-z0-9]+/).filter(w=>w.length>2);
  if(!words.length)return 1;
  const hay=norm([r.title,r.notes,r.why,r.adapt,allTags(r).join(' '),r.ts?.hook,r.ts?.benefit,r.ts?.context].join(' '));
  let s=0;words.forEach(w=>{if(hay.includes(w))s+=2;Object.entries(SYN).forEach(([k,v])=>{if(w.startsWith(k)||v.some(x=>norm(x).startsWith(w)))v.forEach(x=>{if(hay.includes(norm(x)))s+=1})})});
  allTags(r).forEach(t=>{if(norm(q).includes(norm(t)))s+=4});
  return s;
}
function similar(a,b){const A=new Set(norm(a).split(/\W+/).filter(w=>w.length>3)),B=new Set(norm(b).split(/\W+/).filter(w=>w.length>3));if(!A.size||!B.size)return 0;let i=0;A.forEach(w=>B.has(w)&&i++);return i/Math.min(A.size,B.size)}

function reminders(){
  const R=[];const add=(score,lvl,text,act)=>R.push({score,lvl,text,act});
  const open=c=>`data-act="open" data-t="content" data-id="${c.id}"`;
  // compromissos com conteúdos ligados (viagem, evento, janela)
  S.events.filter(e=>e.type==='compromisso').forEach(e=>{
    const end=e.endDate||e.date;const d=diffDays(TODAY,e.date);if(end<TODAY||d>14)return;
    const cs=arr(e.contentIds).map(id=>byId('contents',id)).filter(c=>c&&c.status==='Planejamento');
    const semTakes=cs.filter(needsTakes).length;const pend=cs.filter(c=>progress(c).missing.length).length;
    const quando=d<=0?'em andamento':d===1?'começa amanhã':`começa em ${d} dias`;
    if(cs.length){add(d<=0?95:90-d*3,d<=3?'bad':'warn',`<b>${h(e.title)}</b> ${quando}: ${cs.length} conteúdo${cs.length>1?'s':''} para gravar${semTakes?`, <b>${semTakes} ainda sem takes</b>`:''}${pend?` · ${pend} com takes pendentes`:''}.`,`data-act="go-filter" data-ev="${e.id}"`)}
    else if(d>0)add(60-d,'info',`<b>${h(e.title)}</b> ${quando}. Nenhum conteúdo planejado para ele ainda.`,`data-act="cal-day" data-d="${e.date}"`);
  });
  const tdy=S.takes.filter(t=>t.status!=='gravado'&&takeDay(t)===TODAY).length,late=S.takes.filter(t=>t.status!=='gravado'&&takeDay(t)&&takeDay(t)<TODAY).length;
  if(tdy)add(97,'acc',`<b>Hoje: ${tdy} take${tdy>1?'s':''} para gravar.</b>`,`data-act="cal-day" data-d="${TODAY}"`);
  if(late)add(96,'bad',`<b>${late} take${late>1?'s':''} atrasado${late>1?'s':''}</b> (a data já passou). Grave ou arraste para outro dia.`,`data-act="cal-late"`);

  S.pubs.filter(p=>p.status!=='Publicado'&&p.date>=TODAY&&diffDays(TODAY,p.date)<=1).forEach(p=>{const c=byId('contents',p.contentId);add(92,'acc',`Postar <b>${h(c?.title||'conteúdo')}</b> no ${h(p.platform)} ${rel(p.date)}${p.time?' às '+h(p.time):''}.`,c?open(c):'')});

function takeCard(t,o={}){

      ${!o.compact&&(prods.length||t.fixedEventId)?`<div class="chips">${prods.map(p=>`<span class="chip acc">${h(p.name)}</span>`).join('')}${t.fixedEventId?'<span class="chip warn">data fixa</span>':''}</div>`:''}

function notesFeed(){

  }else if(tab==='takes'){
    const F=UI.takeF,q=norm(UI.takeQ);

    const pend=S.takes.filter(t=>t.status!=='gravado');const dup=[];
    for(let i=0;i<pend.length;i++)for(let j=i+1;j<pend.length;j++){const a=pend[i],b=pend[j];if(arr(a.contexts).some(c=>arr(b.contexts).includes(c))&&similar(a.desc,b.desc)>=.5&&a.framing!==b.framing||(similar(a.desc,b.desc)>=.75&&arr(a.contexts).some(c=>arr(b.contexts).includes(c))))dup.push([a,b])}
    out+=`<form class="sec" data-form="takeq" style="margin-top:12px"><input type="search" id="take-q" value="${h(UI.takeQ)}" placeholder="Buscar take por descrição, cenário, pessoa"></form>
    <div class="scroll-x"><button class="chip btn ${F.status==='pendente'?'on':''}" data-act="tf" data-k="status" data-v="pendente">Pendentes</button><button class="chip btn ${F.status==='gravado'?'on':''}" data-act="tf" data-k="status" data-v="gravado">Gravados</button><button class="chip btn ${!F.status?'on':''}" data-act="tf" data-k="status" data-v="">Todos</button><span style="width:8px"></span>${Object.keys(CTX).filter(k=>S.takes.some(t=>arr(t.contexts).includes(k))).map(k=>`<button class="chip btn ${F.ctx===k?'on':''}" data-act="tf" data-k="ctx" data-v="${F.ctx===k?'':k}">${CTX[k].l}</button>`).join('')}</div>
    ${dup.length&&F.status!=='gravado'?`<div class="sec"><div class="notice info">Takes parecidos em roteiros diferentes. Dá para gravar juntos, mas cada um mantém enquadramento e ação próprios: ${dup.slice(0,3).map(([a,b])=>`<b>${h(a.code)}</b> e <b>${h(b.code)}</b>`).join(' · ')}</div></div>`:''}
    <div class="sec"><div class="list">${list.map(t=>takeCard(t,{capture:t.status!=='gravado'})).join('')||'<div class="empty">Nenhum take.</div>'}</div></div>`;
  }else if(tab==='gravados'){
    const q=norm(UI.libQ);const words=q.split(/\W+/).filter(w=>w.length>2);
    let list=S.takes.filter(t=>t.status==='gravado'&&takeTipoOk(t)).map(t=>{const hay=norm([t.desc,t.setting,t.action,t.location,t.participant,arr(t.contexts).map(ctxL).join(' '),projName(byId('contents',t.contentIds?.[0])?.projectId)].join(' '));let s=words.length?0:1;words.forEach(w=>{if(hay.includes(w))s++;Object.entries(CTX).forEach(([k,v])=>{if(v.s.some(x=>norm(x).trim().startsWith(w))&&arr(t.contexts).includes(k))s++})});return{t,s}}).filter(x=>x.s>0);
    if(UI.libUnused)list=list.filter(x=>!arr(x.t.contentIds).length);
    list.sort((a,b)=>b.s-a.s);
    out+=`<form class="sec" data-form="libq" style="margin-top:12px"><input type="search" id="lib-q" value="${h(UI.libQ)}" placeholder="Ex.: trabalhando no notebook durante uma viagem"></form><div class="row"><button class="chip btn ${UI.libUnused?'on':''}" data-act="lib-unused">Só sem utilização</button><span class="small muted">${list.length} takes gravados</span></div>
    <div class="sec"><div class="list">${list.map(({t})=>libCard(t)).join('')||'<div class="empty">Nenhum take gravado encontrado.</div>'}</div></div>`;
  }else{
    const ready=S.contents.filter(c=>readyForEdit(c)&&tipoOk(c)),ed=S.contents.filter(c=>c.status==='Edição'&&tipoOk(c)),po=S.contents.filter(c=>c.status==='Postagem'&&tipoOk(c));
    const mini=c=>{const ev=S.events.find(e=>e.type==='edicao'&&arr(e.contentIds).includes(c.id)&&e.status!=='concluido');const pub=S.pubs.filter(p=>p.contentId===c.id&&p.status!=='Publicado').sort((a,b)=>a.date.localeCompare(b.date))[0];
      return`<button class="card tap" data-act="open" data-t="content" data-id="${c.id}" style="gap:4px"><h3>${h(c.title)}</h3><div class="small muted">${[c.destino,ev?'editar até '+fmtShort(ev.date):'',pub?`postar ${fmtShort(pub.date)} no ${pub.platform}`:(c.status==='Postagem'?'sem data de postagem':'')].filter(Boolean).map(h).join(' · ')}</div></button>`};
    out+=`<div class="sec"><div class="small muted">Gravação → Edição → Postagem. Cada etapa só avança quando você marca como completa.</div></div>
    ${ready.length?`<div class="sec"><div class="sec-h"><h2>Prontos para editar</h2><span class="small muted">aguardando você marcar</span></div><div class="list">${ready.map(mini).join('')}</div></div>`:''}
    <div class="sec"><div class="sec-h"><h2>Em edição</h2><span class="small muted">${ed.length}</span></div><div class="list">${ed.map(mini).join('')||'<div class="empty">Nada em edição.</div>'}</div></div>
    <div class="sec"><div class="sec-h"><h2>Para postar</h2><span class="small muted">${po.length}</span></div><div class="list">${po.map(mini).join('')||'<div class="empty">Nada esperando postagem.</div>'}</div></div>`;
  }
  return out;
}
function libCard(t){const cs=arr(t.contentIds).map(id=>byId('contents',id)).filter(Boolean);const fs=arr(t.fileIds).map(id=>byId('files',id)).filter(Boolean);
  return`<button class="card tap" data-act="open" data-t="take" data-id="${t.id}"><div class="row between"><h3 class="grow">${h(t.desc)}</h3><span class="mono muted">${h(t.code||'')}</span></div><div class="chips">${arr(t.contexts).map(k=>`<span class="chip">${ctxL(k)}</span>`).join('')}${t.framing?`<span class="chip">${h(t.framing)}</span>`:''}${t.recordedAt?`<span class="chip">${fmtShort(t.recordedAt)}</span>`:''}</div>${fs.map(f=>f.webViewLink?`<div class="small" style="color:var(--accent)">${h(f.name)} · no Drive</div>`:`<div class="folder">${h(drivePath(f,t))}</div>`).join('')||'<div class="small muted">Marcado como gravado, sem arquivo enviado</div>'}<div class="serves">${cs.length?`Usado em: ${cs.map(c=>h(c.title)).join(' · ')}`:'<b>Sem utilização</b> · disponível para novos conteúdos'}</div></button>`}
function drivePath(f,t){return`Creative OS/Biblioteca de Takes/${(t?.code||'TAKE')}_${f.name}`}

/* ---------- CALENDÁRIO ---------- */
const NETS=[['insta','Instagram'],['tiktok','TikTok'],['shop','TikTok Shop'],['ugc','UGC']];
function takeDay(t){if(t.date)return t.date;if(t.fixedEventId){const e=byId('events',t.fixedEventId);if(e)return e.date}return ''}
const netOk=c=>!UI.dayNet||tiposOf(c).includes(UI.dayNet);
function takesOn(d,{pendingOnly=false,net=true}={}){return S.takes.filter(t=>takeDay(t)===d&&(!pendingOnly||t.status!=='gravado')&&(!net||!UI.dayNet||arr(t.contentIds).some(id=>{const c=byId('contents',id);return c&&netOk(c)})))}
function takeRowCal(t,d){
  const cs=arr(t.contentIds).map(id=>byId('contents',id)).filter(Boolean);const done=t.status==='gravado';
  return`<div class="take tk-row ${done?'done':''}" ${done?'':`data-drag-take="${t.id}" data-from="${d}"`}>
    <button class="chk ${done?'done':''}" style="width:26px;height:26px;border-radius:8px" data-act="take-toggle" data-id="${t.id}" aria-label="${done?'Desmarcar take':'Marcar take como gravado'}">${done?'✓':''}</button>
    <div class="grow" style="min-width:0"><button class="tdesc" style="border:0;background:none;padding:0;text-align:left;font-weight:600;font-size:.92rem" data-act="open" data-t="take" data-id="${t.id}">${h(t.desc)}</button>
    <div class="serves">${cs.map(c=>h(c.title)).join(' · ')||'Sem conteúdo'}${t.fixedEventId?' · data fixa':''}</div></div>
    ${done?'':`<button class="icon-btn" style="width:34px;height:34px;font-size:.8rem" data-act="move-take" data-id="${t.id}" data-from="${d}" aria-label="Mover para outro dia">⇄</button><span class="grip" aria-hidden="true">⋮⋮</span>`}
  </div>`;
}
function vCalendario(){
  const M=UI.calMode;const base=UI.calDate||TODAY;
  let out=topBar('Calendário','Gravar, editar, postar',`<button class="icon-btn" data-act="new" data-t="event" data-preset='${h(JSON.stringify({date:UI.calSel||TODAY,type:"compromisso"}))}' aria-label="Novo compromisso">＋</button>`);
  out+=`<div class="tabs">${[['dia','Dia'],['semana','Semana'],['mes','Mês'],['lista','Lista']].map(([k,l])=>`<button class="${M===k?'on':''}" data-act="calmode" data-k="${k}">${l}</button>`).join('')}</div>`;
  const F=UI.calF;
  if(M!=='dia')out+=`<div class="scroll-x" style="margin-top:10px">${[['compromisso','Compromissos'],['gravacao','Gravações'],['edicao','Edições'],['revisao','Revisões'],['publicacao','Postagens']].map(([k,l])=>`<button class="chip btn ${F.types.includes(k)?'on':''}" data-act="calf" data-k="types" data-v="${k}"><span class="dot t-${k}"></span>${l}</button>`).join('')}${(F.types.length||F.plat.length||F.proj)?`<button class="chip btn" data-act="calf-clear">Limpar</button>`:''}</div>`;
  const items=calItems().filter(passFilter);
  if(M==='mes')out+=monthView(base,items);
  else if(M==='dia')out+=dayView(UI.calSel||TODAY,items);
  else if(M==='semana')out+=weekView(UI.calSel||TODAY,items);
  else{const fut=items.filter(x=>x.date>=TODAY&&diffDays(TODAY,x.date)<=45);const days=[...new Set([...fut.map(x=>x.date),...S.takes.filter(t=>t.status!=='gravado'&&takeDay(t)>=TODAY&&diffDays(TODAY,takeDay(t))<=45).map(takeDay)])].sort();
    out+=`<div class="sec"><div class="list">${days.map(d=>{const tk=takesOn(d,{pendingOnly:true});return`<div class="card" style="gap:2px"><button class="row between" style="border:0;background:none;padding:0" data-act="cal-day" data-d="${d}"><b>${fmtD(d)}</b><span class="small muted">${rel(d)}</span></button>${fut.filter(x=>x.date===d).map(calRow).join('')}${tk.length?`<div class="small" style="color:var(--accent);font-weight:700">🎬 ${tk.length} take${tk.length>1?'s':''} para gravar</div>`:''}</div>`}).join('')||'<div class="empty">Nada nos próximos 45 dias.</div>'}</div></div>`}
  return out;
}
function monthView(base,items){
  const [y,m]=base.split('-').map(Number);const first=new Date(y,m-1,1);const start=addDays(iso(first),-((first.getDay()+6)%7));
  const last=new Date(y,m,0);const end=addDays(iso(last),(7-((last.getDay()+6)%7)-1));const weeks=Math.round((diffDays(start,end)+1)/7);
  let out=`<div class="sec"><div class="row between"><button class="icon-btn" data-act="calnav" data-n="-1" aria-label="Mês anterior">‹</button><h2>${MONL[m-1]} ${y}</h2><button class="icon-btn" data-act="calnav" data-n="1" aria-label="Próximo mês">›</button></div>
  <div class="cal-m"><div class="cal-wd">${['seg','ter','qua','qui','sex','sáb','dom'].map(d=>`<span>${d}</span>`).join('')}</div>`;
  for(let w=0;w<weeks;w++){
    const ws=addDays(start,w*7),we=addDays(ws,6);
    const spans=S.events.filter(e=>e.endDate&&e.endDate>e.date&&e.date<=we&&e.endDate>=ws&&passFilter({kind:'event',type:e.type,date:e.date,e})).map(e=>({e,s:e.date<ws?ws:e.date,t:e.endDate>we?we:e.endDate,cont:e.date<ws}));
    const lanes=[];spans.forEach(sp=>{let l=0;while(lanes[l]&&lanes[l].some(o=>!(sp.t<o.s||sp.s>o.t)))l++;(lanes[l]=lanes[l]||[]).push(sp);sp.l=l});
    const rows=2+lanes.length;
    out+=`<div class="cal-wk" style="grid-template-rows:auto ${lanes.length?`repeat(${lanes.length},20px) `:''}1fr">`;
    for(let i=0;i<7;i++){const d=addDays(ws,i);const out_=d.slice(5,7)!=String(m).padStart(2,'0');
      out+=`<button class="cal-cell ${out_?'out':''} ${d===TODAY?'today':''}" style="grid-column:${i+1};grid-row:1/${rows+1}" data-act="cal-day" data-d="${d}" data-dropday="${d}" aria-label="${fmtD(d)}"></button><span class="cal-n ${d===TODAY?'today':''}" style="grid-column:${i+1};grid-row:1">${+d.slice(8)}</span>`}
    spans.forEach(sp=>{const c1=diffDays(ws,sp.s)+1,len=diffDays(sp.s,sp.t)+1;out+=`<span class="cal-bar t-${sp.e.type}" style="grid-column:${c1}/span ${len};grid-row:${2+sp.l}">${sp.cont?'… ':''}${h(sp.e.title)}</span>`});
    for(let i=0;i<7;i++){const d=addDays(ws,i);
      const singles=items.filter(x=>x.date===d&&!x.multi);const tk=takesOn(d,{pendingOnly:true,net:false}).length;
      const labs=singles.map(x=>x.kind==='pub'?{t:'publicacao',l:'Postar: '+(byId('contents',x.p.contentId)?.title||'')}:{t:x.e.type,l:x.e.title.replace(/^(Gravação|Edição|Revisão): /,'')});
      const show=labs.slice(0,2),more=labs.length-show.length;
      out+=`<span class="cal-stack" style="grid-column:${i+1};grid-row:${rows}">${show.map(x=>`<span class="cal-lab t-${x.t}">${h(x.l)}</span>`).join('')}${more>0?`<span class="cal-more">+${more}</span>`:''}${tk?`<span class="cal-tk">🎬 ${tk}</span>`:''}</span>`}
    out+=`</div>`;
  }
  return out+`</div><div class="small muted" style="margin-top:6px">Toque num dia para ver o que gravar. Segure um take e arraste para outro dia na visão Semana ou Dia.</div></div>`;
}
function weekStrip(d){const ws=addDays(d,-((new Date(d+'T12:00:00').getDay()+6)%7));return`<div class="wk-strip">${Array.from({length:7},(_,i)=>{const dd=addDays(ws,i);const n=takesOn(dd,{pendingOnly:true,net:false}).length;return`<button class="wk-pill ${dd===d?'on':''} ${dd===TODAY?'today':''}" data-act="cal-day" data-d="${dd}" data-dropday="${dd}"><span>${WD[new Date(dd+'T12:00:00').getDay()]}</span><b>${+dd.slice(8)}</b>${n?`<i>${n}</i>`:''}</button>`}).join('')}</div>`}
function netChips(){return`<div class="scroll-x"><button class="chip btn ${!UI.dayNet?'on':''}" data-act="daynet" data-k="">Todas as redes</button>${NETS.map(([k,l])=>`<button class="chip btn ${UI.dayNet===k?'on':''}" data-act="daynet" data-k="${k}">${l}</button>`).join('')}</div>`}
function weekView(d,items){
  const ws=addDays(d,-((new Date(d+'T12:00:00').getDay()+6)%7));
  let out=`<div class="sec"><div class="row between"><button class="icon-btn" data-act="dayn" data-n="-7" aria-label="Semana anterior">‹</button><h2>${fmtShort(ws)} – ${fmtShort(addDays(ws,6))}</h2><button class="icon-btn" data-act="dayn" data-n="7" aria-label="Próxima semana">›</button></div>${netChips()}<div class="small muted">Segure um take e arraste para outro dia.</div><div class="list">`;
  for(let i=0;i<7;i++){const dd=addDays(ws,i);const its=items.filter(x=>x.date===dd&&(x.kind!=='pub'||netOk(byId('contents',x.p.contentId)||{})));const tk=takesOn(dd);
    out+=`<div class="card wk-day ${dd===TODAY?'is-today':''}" data-dropday="${dd}" style="gap:4px"><button class="row between" style="border:0;background:none;padding:0" data-act="cal-day" data-d="${dd}"><b style="${dd===TODAY?'color:var(--accent)':''}">${fmtD(dd)}</b><span class="small muted">${tk.filter(t=>t.status!=='gravado').length?`🎬 ${tk.filter(t=>t.status!=='gravado').length}`:''}</span></button>
    ${its.map(it=>`<div class="small stripe t-${it.type}" style="padding-block:2px">${it.kind==='pub'?`Postar: ${h(byId('contents',it.p.contentId)?.title||'')} · ${h(it.p.platform)}`:h(it.e.title)}${it.multi?' <span class="muted">(vários dias)</span>':''}</div>`).join('')}
    ${tk.map(t=>takeRowCal(t,dd)).join('')}
    ${!its.length&&!tk.length?'<span class="small muted">Livre · solte um take aqui</span>':''}</div>`}
  return out+`</div></div>`;
}
function dayView(d,items){
  const its=items.filter(x=>x.date===d);const tk=takesOn(d);const pend=tk.filter(t=>t.status!=='gravado'),done=tk.filter(t=>t.status==='gravado');
  const byC={};pend.forEach(t=>{const k=t.contentIds?.[0]||'_';(byC[k]=byC[k]||[]).push(t)});
  let out=`<div class="sec"><div class="row between"><button class="icon-btn" data-act="dayn" data-n="-1" aria-label="Dia anterior">‹</button><h2>${fmtD(d)}</h2><button class="icon-btn" data-act="dayn" data-n="1" aria-label="Próximo dia">›</button></div>${weekStrip(d)}${netChips()}</div>`;
  out+=`<div class="sec"><div class="sec-h"><h2>Para gravar</h2><span class="small muted">${pend.length} take${pend.length!==1?'s':''}</span></div>`;
  if(pend.length){out+=Object.entries(byC).map(([cid,ts])=>{const c=byId('contents',cid);return`<div class="card" style="gap:6px"><button class="row between" style="border:0;background:none;padding:0;text-align:left" data-act="open" data-t="content" data-id="${cid}"><h3 class="grow">${h(c?.title||'Sem conteúdo')}</h3><span class="chips">${c?tiposOf(c).map(k=>`<span class="chip">${h((NETS.find(n=>n[0]===k)||[])[1]||k)}</span>`).join(''):''}</span></button>${ts.map(t=>takeRowCal(t,d)).join('')}</div>`}).join('');
    out+=`<div class="small muted">Não deu para gravar? Segure o take e solte em outro dia da faixa acima, ou toque em ⇄.</div>`}
  else out+=`<div class="empty">Nenhum take agendado${UI.dayNet?' para essa rede':''} neste dia.</div>`;
  if(done.length)out+=`<div class="sec-h"><h3>Gravados neste dia</h3><span class="small muted">${done.length}</span></div><div class="list">${done.map(t=>takeRowCal(t,d)).join('')}</div>`;
  out+=`</div>`;
  const agenda=its.filter(it=>it.kind!=='pub'||netOk(byId('contents',it.p.contentId)||{}));
  out+=`<div class="sec"><div class="sec-h"><h2>Agenda do dia</h2></div>`;
  if(!agenda.length)out+=`<div class="empty">Nada na agenda.<div style="margin-top:8px"><button class="btn sm" data-act="new" data-t="event" data-preset='${h(JSON.stringify({date:d,type:"compromisso"}))}'>Adicionar compromisso</button></div></div>`;
  else out+=`<div class="list">${agenda.map(it=>{
    if(it.kind==='pub'){const c=byId('contents',it.p.contentId);return`<button class="card tap stripe t-publicacao" data-act="open" data-t="pub" data-id="${it.p.id}" style="gap:2px"><span class="eyebrow">Postagem · ${h(it.p.platform)} ${h(it.time||'')}</span><b>${h(c?.title||'—')}</b></button>`}
    const e=it.e;const opp=e.type==='compromisso'?flexOpps(e).filter(t=>!takeDay(t)&&arr(t.contentIds).some(id=>{const c=byId('contents',id);return c&&netOk(c)})):[];
    return`<div class="card stripe t-${e.type}" style="gap:4px"><div class="row between"><span class="eyebrow">${EVT[e.type]}${it.multi?' · vários dias':''}</span><span class="mono muted">${h(e.time||'')}</span></div><button style="border:0;background:none;padding:0;text-align:left" data-act="open" data-t="event" data-id="${e.id}"><h3>${h(e.title)}</h3></button>
      ${e.location||arr(e.contexts).length?`<div class="small muted">${[e.location,arr(e.contexts).map(ctxL).join(', ')].filter(Boolean).map(h).join(' · ')}</div>`:''}
      ${opp.length?`<details><summary class="small" style="cursor:pointer;color:var(--accent);font-weight:700">${opp.length} take${opp.length>1?'s':''} sem data que combinam com este lugar</summary><div class="list" style="margin-top:6px">${opp.slice(0,20).map(t=>`<div class="row between"><span class="small grow">${h(t.desc)} <span class="muted">· ${h(byId('contents',t.contentIds[0])?.title||'')}</span></span><button class="btn sm" data-act="sched-take" data-id="${t.id}" data-d="${d}">Gravar neste dia</button></div>`).join('')}</div></details>`:''}
      ${['edicao','revisao','finalizacao','gravacao'].includes(e.type)?`<div class="row"><button class="btn sm ${e.status==='concluido'?'ok':''}" data-act="ev-done" data-id="${e.id}">${e.status==='concluido'?'✓ Concluída':'Marcar concluída'}</button></div>`:''}
      ${e.type==='compromisso'&&arr(e.contexts).length?`<div><button class="btn sm pri" data-act="cap-event" data-id="${e.id}">Captar neste lugar</button></div>`:''}
    </div>`}).join('')}</div>`;
  return out+`</div>`;
}

/* ---------- MOVER TAKES ENTRE DIAS ---------- */
function moveTakes(ids,to){
  const moved=ids.map(id=>byId('takes',id)).filter(Boolean);if(!moved.length)return;
  const info=moved.map(t=>({t,from:takeDay(t)}));let unfixed=[];
  moved.forEach(t=>{if(t.fixedEventId){const e=byId('events',t.fixedEventId);if(e&&e.date!==to){unfixed.push(e.title);delete t.fixedEventId}}t.date=to});
  const cids=[...new Set(moved.flatMap(t=>arr(t.contentIds)))];
  // gravação (não fixa) do conteúdo acompanha se ficou sem takes no dia antigo
  cids.forEach(cid=>{const froms=[...new Set(info.filter(x=>arr(x.t.contentIds).includes(cid)).map(x=>x.from).filter(Boolean))];froms.forEach(f=>{const left=S.takes.some(t=>arr(t.contentIds).includes(cid)&&t.status!=='gravado'&&takeDay(t)===f);if(!left)S.events.filter(e=>e.type==='gravacao'&&!e.fixed&&e.date===f&&arr(e.contentIds).includes(cid)).forEach(e=>e.date=to)})});
  saveAll('takes','events');
  render();toast(`${moved.length} take${moved.length>1?'s':''} movido${moved.length>1?'s':''} para ${fmtD(to)}`);
  datesPopup(cids,to,unfixed);
}
function datesPopup(cids,rec,unfixed=[]){
  const rows=cids.map(cid=>{const c=byId('contents',cid);if(!c)return'';
    const evs=S.events.filter(e=>['edicao','revisao','finalizacao'].includes(e.type)&&arr(e.contentIds).includes(cid)&&e.status!=='concluido').sort((a,b)=>a.date.localeCompare(b.date));
    const pubs=S.pubs.filter(p=>p.contentId===cid&&p.status!=='Publicado').sort((a,b)=>a.date.localeCompare(b.date));
    const lastRec=S.takes.filter(t=>arr(t.contentIds).includes(cid)&&t.status!=='gravado').map(takeDay).filter(Boolean).sort().pop()||rec;
    let floor=lastRec;const field=(kind,id,label,cur)=>{const sug=cur>floor?cur:addDays(floor,1);floor=sug;const bad=cur<=lastRec;return`<label class="f">${label}${bad?' <span class="chip bad" style="font-size:.66rem">antes ou no dia da gravação</span>':''}<input type="date" data-pdk="${kind}" data-pdid="${id}" value="${sug}"></label>`};
    const inner=evs.map(e=>field('ev',e.id,`${EVT[e.type]} (era ${fmtShort(e.date)})`,e.date)).join('')+pubs.map(p=>field('pub',p.id,`Postagem ${p.platform} (era ${fmtShort(p.date)})`,p.date)).join('');
    const none=!evs.length&&!pubs.length;
    return`<div class="card" style="gap:8px"><h3>${h(c.title)}</h3><div class="small muted">Último take a gravar: ${fmtD(lastRec)}</div>${none?`<div class="small">Ainda sem data de edição ou postagem. Quer definir agora?</div><label class="f">Edição<input type="date" data-pdk="newedit" data-pdid="${cid}" value=""></label><label class="f">Postagem<input type="date" data-pdk="newpub" data-pdid="${cid}" value=""></label>`:inner}</div>`}).join('');
  sheet('Ajustar edição e postagem?',`${unfixed.length?`<div class="notice">Esses takes dependiam de ${unfixed.map(h).join(', ')}. Agora ficam com data livre.</div>`:''}<div class="small muted">Os takes mudaram de dia. Confira as datas sugeridas abaixo.</div>${rows}<div class="row"><button class="btn pri grow" data-act="pd-apply">Salvar datas</button><button class="btn" data-act="close-form">Manter como está</button></div>`);
}
function applyDatesPopup(){
  let n=0;document.querySelectorAll('[data-pdk]').forEach(inp=>{const v=inp.value;if(!v)return;const k=inp.dataset.pdk,id=inp.dataset.pdid;
    if(k==='ev'){const e=byId('events',id);if(e&&e.date!==v){e.date=v;n++}}
    if(k==='pub'){const p=byId('pubs',id);if(p&&p.date!==v){p.date=v;n++}}
    if(k==='newedit'){const c=byId('contents',id);S.events.push({id:uid('e'),title:'Edição: '+c.title,type:'edicao',date:v,contentIds:[id],projectId:c.projectId,status:'pendente',responsible:'Julia',auto:true});n++}
    if(k==='newpub'){const c=byId('contents',id);S.pubs.push({id:uid('p'),contentId:id,platform:arr(c.platforms)[0]||'Instagram',date:v,status:'Programada'});n++}
  });
  S.contents.forEach(c=>{const f=S.pubs.filter(p=>p.contentId===c.id).map(p=>p.date).sort()[0];if(f)c.pubDate=f});
  saveAll('events','pubs','contents');closeForm();render();toast(n?`${n} data${n>1?'s':''} atualizada${n>1?'s':''}`:'Datas mantidas');
}

/* ---------- ARRASTAR (toque longo + arrastar; mouse também) ---------- */
let DRAG=null,PEND=null;
function dragStart(src,x,y){
  const t=byId('takes',src.dataset.dragTake);if(!t)return;
  const g=document.createElement('div');g.className='drag-ghost';g.textContent='🎬 '+t.desc;document.body.appendChild(g);
  DRAG={id:t.id,from:src.dataset.from,g,src,over:null};src.classList.add('dragging');document.body.classList.add('is-dragging');dragMove(x,y);
}
function dragMove(x,y){if(!DRAG)return;DRAG.g.style.left=x+'px';DRAG.g.style.top=(y-34)+'px';
  const el=document.elementFromPoint(x,y)?.closest('[data-dropday]');if(DRAG.over&&DRAG.over!==el)DRAG.over.classList.remove('drop-on');if(el){el.classList.add('drop-on');DRAG.over=el}else DRAG.over=null}
function dragEnd(){if(!DRAG)return;const to=DRAG.over?.dataset.dropday;DRAG.g.remove();DRAG.src.classList.remove('dragging');DRAG.over?.classList.remove('drop-on');document.body.classList.remove('is-dragging');const {id,from}=DRAG;DRAG=null;UI._justDragged=Date.now();if(to&&to!==from)moveTakes([id],to)}
function pendStart(e,x,y){const src=e.target.closest('[data-drag-take]');if(!src||e.target.closest('.chk,button:not(.tdesc)'))return;PEND={src,x,y,timer:setTimeout(()=>{if(PEND){dragStart(PEND.src,PEND.x,PEND.y);PEND=null}},380)}}
function pendCancel(){if(PEND){clearTimeout(PEND.timer);PEND=null}}
document.addEventListener('touchstart',e=>{const p=e.touches[0];pendStart(e,p.clientX,p.clientY)},{passive:true});
document.addEventListener('touchmove',e=>{const p=e.touches[0];if(DRAG){e.preventDefault();dragMove(p.clientX,p.clientY)}else if(PEND&&Math.hypot(p.clientX-PEND.x,p.clientY-PEND.y)>10)pendCancel()},{passive:false});
document.addEventListener('touchend',()=>{pendCancel();dragEnd()});
document.addEventListener('touchcancel',()=>{pendCancel();dragEnd()});
document.addEventListener('mousedown',e=>{if(e.button===0)pendStart(e,e.clientX,e.clientY)});
document.addEventListener('mousemove',e=>{if(DRAG)dragMove(e.clientX,e.clientY);else if(PEND&&Math.hypot(e.clientX-PEND.x,e.clientY-PEND.y)>6)pendCancel()});
document.addEventListener('mouseup',()=>{pendCancel();dragEnd()});
document.addEventListener('contextmenu',e=>{if(e.target.closest('[data-drag-take]'))e.preventDefault()});

    const lm=s.match(/^([^:"“]{2,40}?)\s*:\s*(.*)$/);const lk=lm?labelKind(lm[1]):null;
    if(lk==='legenda'){if(/#/.test(lm[2])||lm[2].length>70||!cur){inCaption=true;caption=join(caption,lm[2],'\n')}else if(cur)addTo(cur,'overlay',lm[2]);continue}
    if(lk==='caption'||(inCaption&&!headerOf(t))){if(lk==='caption'){inCaption=true;caption=join(caption,lm[2],'\n')}else caption=join(caption,s,'\n');continue}
    const hd=lk&&lk!=='meta'?null:headerOf(t);
    if(hd){if(cur&&isEmptyScene(cur)&&!cur.scene.match(/\d/))cur.scene=hd.label;else{cur=newScene(hd.label);scenes.push(cur)}if(hd.rest){const lm2=hd.rest.match(/^([^:"“]{2,40}?)\s*:\s*(.*)$/);const k2=lm2?labelKind(lm2[1]):null;if(k2&&k2!=='meta'&&k2!=='caption')addTo(cur,k2,lm2[2],lm2[1]);else addTo(cur,'fala',hd.rest)}continue}
    if(lk==='meta'){if(cur&&/dura|tempo/.test(norm(lm[1]))&&lm[2])cur.scene=join(cur.scene,'('+lm[2]+')',' ');continue}
    if(!cur){if(lk&&lk!=='meta'){cur=newScene('');scenes.push(cur)}else if(/^(roteiro|t[ií]tulo|v[ií]deo|ideia|conceito)\b/i.test(s)||s.length<4)continue;else{cur=newScene('');scenes.push(cur)}}
    if(lk){if(lm[2])addTo(cur,lk,lm[2],lm[1]);else cur._last=lk==='narr'?'fala':lk;if(lk==='narr')cur.mode=cur.mode||'narrado';continue}
    const isBullet=/^\s*(?:[-•*·▪︎◦–]|\d{1,2}[.)])\s+/.test(t);
    if(/^\(.*\)$|^\[.*\]$/.test(s)){classifyDirection(cur,s.slice(1,-1));continue}
    if(/^["“].*["”]$/.test(s)){addTo(cur,'fala',s);continue}
    if(isBullet&&['take','insert','edit','overlay','note'].includes(cur._last)){addTo(cur,cur._last,s);continue}
    if(isBullet&&!/^["“]/.test(s)){addTo(cur,RX.insert.test(s)?'insert':'take',s);cur._last='fala';continue}
    addTo(cur,cur._last==='narr'?'fala':(['take','insert','edit','overlay','note'].includes(cur._last)&&!isBullet?cur._last:'fala'),s);
  }
  flushTable();
  let out=scenes.filter(sc=>!isEmptyScene(sc));
  if(out.length<=1&&!lines.some(l=>headerOf(l))){const paras=String(text).split(/\n\s*\n/).map(p=>p.trim()).filter(Boolean);if(paras.length>1&&!/\|/.test(text)){out=[];paras.forEach(p=>{const sc=newScene('');p.split('\n').forEach(l=>{const s=stripMd(l);const lm=s.match(/^([^:"“]{2,40}?)\s*:\s*(.*)$/);const k=lm?labelKind(lm[1]):null;if(k&&k!=='meta'&&k!=='caption')addTo(sc,k,lm[2],lm[1]);else if(/^\(.*\)$|^\[.*\]$/.test(s))classifyDirection(sc,s.slice(1,-1));else addTo(sc,'fala',s)});if(!isEmptyScene(sc))out.push(sc)})}}
  out.forEach((sc,i)=>{sc.text=cap1(sc.text);if(!sc.scene)sc.scene=String(i+1);else if(!/^\d/.test(sc.scene))sc.scene=(i+1)+' · '+sc.scene;
    if(!sc.text&&!sc.mode)sc.mode='semfala';else if(sc.text&&!sc.mode)sc.mode='camera';sc.takes=[...new Set(sc.takes)];sc.inserts=[...new Set(sc.inserts)];delete sc._last});

}

function nextCode(){const n=S.takes.map(t=>+String(t.code||'').replace(/\D/g,'')||0);return'T-'+String(Math.max(0,...n)+1).padStart(3,'0')}
function submitForm(){
  const D=DRAFT;const F=FORMS[D.type];const d=D.data;
  const must={ref:'title',idea:'title',content:'title',take:'desc',product:'name',project:'name',event:'title',pub:'contentId',line:'text'}[D.type];
  if(must&&!getP(d,must)){toast('Preencha o campo principal antes de salvar.');return}
  if(D.type==='line'){const c=byId('contents',D.ctx.cid);c.script=c.script||{version:1,lines:[]};if(D.ctx.i==null)c.script.lines.push(d);else c.script.lines[D.ctx.i]=d;save('contents');closeForm();refresh();toast('Fala salva');return}
  const list=S[F.key];
  if(D.type==='take'){if(!d.code)d.code=nextCode();if(d.status==='gravado'&&!d.recordedAt)d.recordedAt=TODAY}
  if(D.type==='project'){d.fronts=d.fronts||[]}
  let old=null;
  if(D.isNew){d.id=uid(D.type[0]);list.push(d)}else{const i=list.findIndex(x=>x.id===D.id);old=list[i];list[i]=d}
  // vínculos bidirecionais
  if(D.type==='ref')syncBack('contents','refIds',d.id,arr(d.contentIds),old?arr(old.contentIds):[]);
  if(D.type==='content'){syncBack('refs','contentIds',d.id,arr(d.refIds),old?arr(old.refIds):[]);if(D.fromIdea){const idea=byId('ideas',D.fromIdea);if(idea){idea.status='Virou conteúdo';save('ideas')}}}
  if(D.type==='product'){}
  if(D.type==='event'){
    if(old&&old.date!==d.date){const delta=diffDays(old.date,d.date);const moved=S.events.filter(e=>e.sourceId===d.id);moved.forEach(e=>{e.date=addDays(e.date,delta);if(e.endDate)e.endDate=addDays(e.endDate,delta)});if(moved.length)toast(`${moved.length} gravação(ões) acompanharam a nova data`)}
    if(d.autoRec&&d.type==='compromisso'&&arr(d.contentIds).length&&!S.events.some(e=>e.sourceId===d.id&&e.type==='gravacao')){S.events.push({id:uid('e'),title:'Gravação: '+d.title,type:'gravacao',date:d.date,time:d.time,contexts:d.contexts,location:d.location,projectId:d.projectId,contentIds:d.contentIds,fixed:true,sourceId:d.id,status:'pendente'});contentTakesFixed(d)}
    delete d.autoRec;
  }
  if(D.type==='pub'){const c=byId('contents',d.contentId);if(c){const first=S.pubs.filter(p=>p.contentId===c.id).map(p=>p.date).sort()[0];if(first)c.pubDate=first;save('contents');if(contentConflicts(c).length)toast('Atenção: a nova data conflita com tarefas de produção')}}
  save(F.key);
  if(D.type==='take'&&old&&old.status!==d.status)setTakeStatus(d,d.status);
  closeForm();refresh();
  if(D.type!=='event'||!old||old.date===d.date)toast(D.isNew?`${F.title} criada`:'Alterações salvas');
}
function contentTakesFixed(ev){arr(ev.contentIds).forEach(cid=>{const c=byId('contents',cid);if(!c)return;contentTakes(c).forEach(t=>{if(!t.fixedEventId&&t.status!=='gravado'&&arr(t.contexts).some(x=>arr(ev.contexts).includes(x)))t.fixedEventId=ev.id})});save('takes')}
function syncBack(k,field,id,now,before){S[k].forEach(x=>{const has=arr(x[field]).includes(id);if(now.includes(x.id)&&!has)x[field]=[...arr(x[field]),id];if(!now.includes(x.id)&&before.includes(x.id)&&has)x[field]=x[field].filter(i=>i!==id)});save(k)}
function deleteEntity(){
  const D=DRAFT;
  if(!D.confirmDel){D.confirmDel=true;drawForm();return}
  if(D.type==='line'){const c=byId('contents',D.ctx.cid);c.script.lines.splice(D.ctx.i,1);save('contents');closeForm();refresh();return}
  const F=FORMS[D.type];const id=D.id;
  S[F.key]=S[F.key].filter(x=>x.id!==id);
  if(D.type==='take'){S.contents.forEach(c=>arr(c.script?.lines).forEach(l=>{if(arr(l.takeIds).includes(id))l.takeIds=l.takeIds.filter(i=>i!==id)}));S.files.forEach(f=>{f.takeIds=arr(f.takeIds).filter(i=>i!==id)});saveAll('contents','files');toast('Take excluído. Os arquivos continuam na biblioteca.')}
  if(D.type==='content'){S.takes.forEach(t=>t.contentIds=arr(t.contentIds).filter(i=>i!==id));S.refs.forEach(r=>r.contentIds=arr(r.contentIds).filter(i=>i!==id));S.events.forEach(e=>e.contentIds=arr(e.contentIds).filter(i=>i!==id));S.pubs=S.pubs.filter(p=>p.contentId!==id);saveAll('takes','refs','events','pubs');if(UI.detail?.id===id)UI.detail=null;toast('Conteúdo excluído. Takes e arquivos foram mantidos.')}
  if(D.type==='event'){S.events.forEach(e=>{if(e.sourceId===id)delete e.sourceId});S.takes.forEach(t=>{if(t.fixedEventId===id)delete t.fixedEventId});save('takes')}
  if(D.type==='project'){S.contents.forEach(c=>{if(c.projectId===id)c.projectId=''});S.events.forEach(e=>{if(e.projectId===id)e.projectId=''});saveAll('contents');if(UI.detail?.id===id)UI.detail=null}
  if(D.type==='product'){S.takes.forEach(t=>t.productIds=arr(t.productIds).filter(i=>i!==id));S.contents.forEach(c=>c.productIds=arr(c.productIds).filter(i=>i!==id));saveAll('takes','contents');if(UI.detail?.id===id)UI.detail=null}
  save(F.key);S.events=S.events;save('events');closeForm();refresh();
}

function busy(d){return S.events.filter(e=>e.date===d&&e.type==='compromisso').length>=2}
function calcPlan(c,pub){
  const fixedEvIds=[...new Set(contentTakes(c).map(t=>t.fixedEventId).filter(Boolean))];const fixedEv=fixedEvIds.map(id=>byId('events',id)).filter(e=>e&&e.date<=pub).sort((a,b)=>b.date.localeCompare(a.date))[0];
  let rec,recFixed=false;
  const nb=c.notBefore&&c.notBefore>TODAY?c.notBefore:TODAY;
  if(fixedEv){rec=fixedEv.date;recFixed=true}else{rec=addDays(pub,-5);let g=0;while((busy(rec)||rec<nb)&&g<40){rec=rec<nb?nb:addDays(rec,-1);g++}}
  let ed=addDays(rec,1);let rv=addDays(pub,-2);if(ed>=rv)ed=addDays(rv,-1);
  let g=0;while(busy(ed)&&ed<addDays(rv,-1)&&g<5){ed=addDays(ed,1);g++}
  const warn=[];if(ed<=rec)warn.push('Pouco tempo entre gravação e publicação. Considere adiar a publicação.');if(rec<TODAY)warn.push('A data de gravação sugerida já passou.');if(c.notBefore&&rec<c.notBefore)warn.push('A gravação ficou antes de '+fmtShort(c.notBefore)+'. Escolha uma data de postagem mais tarde.');if(c.notBefore&&pub<=c.notBefore)warn.push('Este conteúdo só pode ser gravado a partir de '+fmtShort(c.notBefore)+'.');
  UI._pd={cid:c.id,pub,rows:[['gravacao',rec,recFixed],['edicao',ed],['revisao',rv]]};
  const out=document.getElementById('pd-out');if(!out)return;
  out.innerHTML=`<div class="card">${UI._pd.rows.map(([t,d,fx],i)=>`<div class="cal-item"><span class="time">${fmtShort(d)}</span><span class="stripe t-${t} grow"><b>${EVT[t]}</b>${t==='gravacao'?(fx?` fixa · durante ${h(fixedEv.title)}`:' flexível'):''}<br><input type="date" id="pd-${i}" data-pd="${i}" value="${d}" style="margin-top:4px;min-height:36px"></span></div>`).join('')}<div class="cal-item"><span class="time">${fmtShort(pub)}</span><span class="stripe t-publicacao grow"><b>Publicação</b></span></div></div>${warn.map(w=>`<div class="notice">${h(w)}</div>`).join('')}<div class="small muted">Respeita eventos fixos e evita dias com dois ou mais compromissos.</div><button class="btn pri wide" data-act="pd-save">Criar no calendário</button>`;
}

  const code=qp.get('code');
  if(code||urlErr){try{history.replaceState(null,'',location.pathname)}catch(_){}}
  if(urlErr)UI._err='O Google/Supabase recusou o login: '+urlErr.replace(/\+/g,' ');
  if(code){const {data:ex,error:exErr}=await SB.auth.exchangeCodeForSession(code);if(exErr)UI._err='Não consegui concluir o login: '+exErr.message+(/verifier/i.test(exErr.message)?' Abra o app direto no Safari ou Chrome (não pelo link do WhatsApp) e tente de novo.':'');else if(ex?.session)UI._exchanged=ex.session}
  const {data}=await SB.auth.getSession();SESSION=data.session||UI._exchanged||null;
  SB.auth.onAuthStateChange((_e,s)=>{if(s)SESSION=s});
  if(!SESSION){MODE='login';return false}
  if(WEBCFG.allowedEmail&&norm(SESSION.user.email)!==norm(WEBCFG.allowedEmail)){await SB.auth.signOut();MODE='login';UI._err='Esta conta não tem acesso a este Creative OS.';return false}
  if(SESSION.provider_refresh_token){try{await api('/api/google-token',{method:'POST',body:JSON.stringify({refresh_token:SESSION.provider_refresh_token})})}catch(e){console.warn('token',e)}}
  if(SESSION.provider_token)GTOK={t:SESSION.provider_token,exp:Date.now()+50*60e3};
  const uidv=SESSION.user.id;
  const {data:rows,error}=await SB.from('os_docs').select('key,items');
  if(error){MODE='error';UI._err='Não consegui ler seus dados: '+error.message;return false}
  arr(rows).forEach(r=>{if(KEYS.includes(r.key))S[r.key]=arr(r.items);if(r.key==='drive'&&r.items&&!Array.isArray(r.items))Object.assign(DRIVE.folders,r.items.folders||{})});
  DB={doc:path=>({set:async({items})=>{const {error}=await SB.from('os_docs').upsert({user_id:uidv,key:path.split('/').pop(),items,updated_at:new Date().toISOString()});if(error)throw Object.assign(new Error(error.message),{code:error.code})}})};
  if(WEBCFG.ai)SAMPLE={json:async(prompt,opts={})=>{const j=await api('/api/ai',{method:'POST',body:JSON.stringify({prompt,tier:opts.modelTier||'default'})});return j.result}};
  // backup diário
  try{const {data:b}=await SB.from('os_backups').select('created_at').order('created_at',{ascending:false}).limit(1);if(!b?.length||Date.now()-new Date(b[0].created_at)>864e5){const snap={};KEYS.forEach(k=>snap[k]=S[k]);await SB.from('os_backups').insert({user_id:uidv,data:snap})}}catch(e){}
  MODE='web';return true;
}
function saveDrive(){if(MODE==='web'&&SB)SB.from('os_docs').upsert({user_id:SESSION.user.id,key:'drive',items:{folders:DRIVE.folders},updated_at:new Date().toISOString()}).then(()=>{})}
async function gToken(){if(GTOK&&GTOK.exp>Date.now()+60e3)return GTOK.t;const j=await api('/api/google-token');GTOK={t:j.access_token,exp:Date.now()+(j.expires_in||3000)*1000};return GTOK.t}
async function gdrive(path,opt={}){const t=await gToken();const r=await fetch('https://www.googleapis.com/drive/v3/'+path,{...opt,headers:{Authorization:'Bearer '+t,'Content-Type':'application/json; charset=UTF-8'}});if(!r.ok){const tx=await r.text();throw Object.assign(new Error('Google Drive '+r.status+': '+tx.slice(0,160)),{status:r.status})}return r.json()}
const safeName=s=>String(s||'Sem nome').replace(/[\\/]/g,'-').slice(0,120);
async function driveFolder(names){
  let parent='root',key='';
  for(const raw of names){const name=safeName(raw);key+='/'+name;let id=DRIVE.folders[key];
    if(id&&!DRIVE.checked[key]){try{const f=await gdrive(`files/${id}?fields=id,trashed`);if(f.trashed)id=null}catch(e){id=null}DRIVE.checked[key]=true}
    if(!id){const f=await gdrive('files?fields=id',{method:'POST',body:JSON.stringify({name,mimeType:'application/vnd.google-apps.folder',parents:[parent]})});id=f.id;DRIVE.folders[key]=id;DRIVE.checked[key]=true;saveDrive()}
    parent=id}
  return parent;
}
async function driveUpload(file,parent,onProg){
  let t=await gToken();
  const init=await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable&fields=id,name,size,webViewLink',{method:'POST',headers:{Authorization:'Bearer '+t,'Content-Type':'application/json; charset=UTF-8','X-Upload-Content-Type':file.type||'application/octet-stream','X-Upload-Content-Length':String(file.size)},body:JSON.stringify({name:file.name,parents:[parent]})});
  if(!init.ok)throw new Error('Não consegui iniciar o envio ('+init.status+').');
  const loc=init.headers.get('Location');if(!loc)throw new Error('O Google não devolveu o endereço de envio.');
  const CH=8*1024*1024;let start=0,fails=0;
  while(true){
    const end=Math.min(start+CH,file.size);
    try{
      const r=await fetch(loc,{method:'PUT',headers:{'Content-Range':`bytes ${start}-${end-1}/${file.size}`},body:file.slice(start,end)});
      if(r.status===308){const rg=r.headers.get('Range');start=rg?(+rg.split('-')[1]+1):end;fails=0;onProg(start/file.size);continue}
      if(r.ok){onProg(1);return r.json()}
      if(r.status>=500&&fails<4){fails++;await new Promise(z=>setTimeout(z,1500*fails));continue}
      throw new Error('O envio falhou ('+r.status+').');
    }catch(e){
      if(fails>=4)throw new Error('A conexão caiu durante o envio. Tente de novo com internet melhor.');
      fails++;await new Promise(z=>setTimeout(z,2000*fails));
      try{const q=await fetch(loc,{method:'PUT',headers:{'Content-Range':`bytes */${file.size}`}});if(q.ok)return q.json();if(q.status===308){const rg=q.headers.get('Range');start=rg?(+rg.split('-')[1]+1):0}}catch(_){}
    }
  }
}
async function realUpload(t,files){
  const cs=arr(t.contentIds).map(id=>byId('contents',id)).filter(Boolean);
  const box=()=>document.getElementById('up-box');
  sheet('Enviando para o Drive',`<div id="up-box" class="list"></div><div class="notice info">Não feche o app nem apague o vídeo do celular até aparecer "Concluído".</div>`);
  const done=[];
  for(const [i,file] of files.entries()){
    const row=document.createElement('div');row.className='card';row.innerHTML=`<b class="small">${h(file.name)}</b><div class="bar acc"><i style="width:0%"></i></div><span class="small muted">Preparando pastas…</span>`;box()?.appendChild(row);
    const bar=row.querySelector('i'),lab=row.querySelector('span');
    try{
      const lib=await driveFolder(['Creative OS','Biblioteca de Takes']);
      lab.textContent='Enviando… 0%';
      const up=await driveUpload(file,lib,p=>{bar.style.width=Math.round(p*100)+'%';lab.textContent='Enviando… '+Math.round(p*100)+'%'});
      lab.textContent='Criando atalhos nas pastas dos conteúdos…';
      const shortcuts=[];
      for(const c of cs){try{const pf=await driveFolder(['Creative OS','Projetos',c.projectId?projName(c.projectId):'Sem projeto',c.title]);const sc=await gdrive('files?fields=id',{method:'POST',body:JSON.stringify({name:`${t.code||'TAKE'} ${file.name}`,mimeType:'application/vnd.google-apps.shortcut',shortcutDetails:{targetId:up.id},parents:[pf]})});shortcuts.push({contentId:c.id,id:sc.id})}catch(e){console.warn('atalho',e)}}
      const rec={id:uid('f'),name:file.name,size:file.size,type:file.type,date:TODAY,takeIds:[t.id],driveId:up.id,webViewLink:up.webViewLink||`https://drive.google.com/file/d/${up.id}/view`,shortcuts,simulated:false};
      S.files.push(rec);t.fileIds=[...arr(t.fileIds),rec.id];done.push(rec);save('files');
      row.innerHTML=`<b class="small">✓ ${h(file.name)}</b><div class="small" style="color:var(--ok)">Concluído no Drive${shortcuts.length?` · atalho em ${shortcuts.length} pasta${shortcuts.length>1?'s':''}`:''}. Pode apagar do celular.</div><a class="small" href="${h(rec.webViewLink)}" target="_blank" rel="noopener" style="color:var(--accent)">Abrir no Drive</a>`;
    }catch(e){row.innerHTML=`<b class="small">${h(file.name)}</b><div class="small" style="color:var(--bad)">Não enviado: ${h(e.message)}</div><div class="small muted">O vídeo continua só no seu celular. Não apague.</div>`}
  }
  if(done.length){if(t.status!=='gravado')setTakeStatus(t,'gravado');else save('takes');toast(done.length+' arquivo(s) no Drive');refreshKeepSheet();
    box()?.insertAdjacentHTML('afterend','<button class="btn pri" data-act="close-form">Continuar gravando</button>')}
}
let REC=null;
function toggleMic(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return toast('Este navegador não tem reconhecimento de voz. Use o microfone do teclado.');
  if(REC){REC.stop();return}
  const base=V.text?V.text.trim()+' ':'';REC=new SR();REC.lang='pt-BR';REC.continuous=true;REC.interimResults=true;
  REC.onresult=e=>{let txt='';for(const r of e.results)txt+=r[0].transcript;V.text=base+txt;const ta=document.getElementById('voice-text');if(ta)ta.value=V.text};
  REC.onerror=e=>{toast(e.error==='not-allowed'?'Libere o microfone para o Creative OS nas configurações do navegador.':'O microfone parou ('+e.error+').')};
  REC.onend=()=>{REC=null;render()};
  try{REC.start();render()}catch(e){REC=null;toast('Não consegui ligar o microfone.')}
}
function importData(file){
  const fr=new FileReader();fr.onload=()=>{try{const j=JSON.parse(fr.result);const src=j.collections||j;let n=0;
    KEYS.forEach(k=>{const v=src[k];const items=Array.isArray(v)?v:arr(v?.items);if(items.length||Array.isArray(v)){S[k]=items;save(k);n+=items.length}});
    toast(n?`${n} registros importados`:'Arquivo sem dados reconhecidos.');render()}catch(e){toast('Arquivo inválido: use o backup .json do Creative OS.')}};fr.readAsText(file)}
function exportData(){const snap={app:'creative-os',exportedAt:new Date().toISOString(),collections:{}};KEYS.forEach(k=>snap.collections[k]=S[k]);const b=new Blob([JSON.stringify(snap)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`creative-os-backup-${TODAY}.json`;document.body.appendChild(a);a.click();a.remove()}
function vConta(){
  if(MODE!=='web')return`<div class="sec"><div class="notice info">Conta, backup e importação ficam disponíveis no app web (Fase 2).</div></div>`;
  return`<div class="sec"><div class="card"><h3>Conta</h3><div class="small">${h(SESSION?.user?.email||'')}</div><div class="small muted">Drive: pastas em "Creative OS" no seu Google Drive.</div><button class="btn sm" data-act="logout" style="align-self:flex-start">Sair</button></div>
  <div class="card"><h3>Dados</h3><div class="small muted">Backup automático diário no banco. Você também pode baixar uma cópia.</div><div class="row"><button class="btn sm" data-act="export">Baixar backup</button><button class="btn sm" data-act="import-file">Importar backup</button><input type="file" id="import-input" data-import="1" accept="application/json,.json" hidden></div></div></div>`;
}
function vLogin(){return`<div class="boot" style="min-height:80vh"><div style="display:flex;flex-direction:column;gap:14px;align-items:center;max-width:320px"><span class="rec-dot" style="width:16px;height:16px"></span><h1 style="font-family:var(--f-display);font-size:2rem;margin:0">Creative OS</h1><div class="muted">Entre com sua conta Google. O app vai pedir acesso ao seu Google Drive, só aos arquivos e pastas que ele mesmo criar.</div>${UI._err?`<div class="notice bad">${h(UI._err)}</div>`:''}<button class="btn pri wide" data-act="login">Entrar com Google</button></div></div>`}

/* ============ BOOT ============ */
(async function boot(){
  const tok=(location.hash||'').slice(1);if(VIEWS.some(v=>v[0]===tok))UI.view=tok;
  render();
  if(window.COS_WEB){await webInit();render();return}
  const use=n=>window.claude?.use?window.claude.use(n).catch(()=>null):Promise.resolve(null);
  const [db,sample]=await Promise.all([use('db'),use('sample')]);
  SAMPLE=sample||null;
  if(db){DB=db;MODE='db';await Promise.all(KEYS.map(async k=>{try{const s=await db.doc('os/'+k).get();S[k]=s.exists?arr(s.data().items):[]}catch(e){}}))}
  else{MODE='local';KEYS.forEach(k=>{try{S[k]=JSON.parse(localStorage.getItem('cos_'+k)||'[]')}catch(e){}})}
  render();
})();
</script>
